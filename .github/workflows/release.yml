name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Verification Suite
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build & Publish GitHub Release
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Package Release Assets
        run: |
          mkdir -p dist/
          cp apps/cli/dist/index.js dist/sweep-darwin-arm64
          cp apps/cli/dist/index.js dist/sweep-darwin-x64
          chmod +x dist/sweep-darwin-arm64 dist/sweep-darwin-x64
          cd dist/
          shasum -a 256 sweep-darwin-arm64 > sweep-darwin-arm64.sha256
          shasum -a 256 sweep-darwin-x64 > sweep-darwin-x64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sweep-darwin-arm64
            dist/sweep-darwin-arm64.sha256
            dist/sweep-darwin-x64
            dist/sweep-darwin-x64.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
